version: 1
note: "Tuning set for app/redflags.py. Every item must give exactly the expected result."
# Written as callers sound through speech-to-text: lowercase, missing accents, fillers,
# run-on sentences, self-corrections, and sometimes a relative calling for the patient.
# `turns` holds one or two consecutive caller transcripts of the same call; `expect` is
# the set of reasons a RedFlagTracker fed every turn in order has returned by the end.
# `[]` means the matcher must never fire. A licensed dentist has not reviewed this set
# (contracts §6.2, decision D13).
