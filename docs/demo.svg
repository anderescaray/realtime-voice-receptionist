<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-label="Animated demo: a caller books a dental cleaning with the AI receptionist">
<style>
:root{--bg:#0f171b;--panel:#162128;--border:#2c3f49;--text:#e6eef2;--muted:#8fa6b2;--cb:#24343d;--ct:#e6eef2;--ab:#0b6e6e;--ok:#3cb8b0;--fn:#7fd1ff}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif}
.msg{font-size:14px}
.lbl{font-size:11px;fill:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.fn{fill:var(--fn)} .ok{fill:var(--ok)}
.tool{fill:#0b1216;stroke:var(--border)}
.card{fill:#10251f;stroke:var(--ok)}
.cardt{font-size:14px;font-weight:600;fill:var(--text)}
.cards{font-size:12px;fill:var(--muted)}
.title{font-size:15px;font-weight:600;fill:var(--text)}
.sub{font-size:12px;fill:var(--muted)}
.bar{fill:var(--ok);transform-box:fill-box;transform-origin:center;animation:wave 1s ease-in-out infinite alternate}
@keyframes wave{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
.live{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
g[class^=g]{opacity:0}
@keyframes k0{0%,4.00%{opacity:0;transform:translateY(8px)}7.00%,93.33%{opacity:1;transform:none}96.67%,100%{opacity:0}}.g0{animation:k0 15.0s ease-out infinite}@keyframes k1{0%,16.00%{opacity:0;transform:translateY(8px)}19.00%,93.33%{opacity:1;transform:none}96.67%,100%{opacity:0}}.g1{animation:k1 15.0s ease-out infinite}@keyframes k2{0%,21.33%{opacity:0;transform:translateY(8px)}24.33%,93.33%{opacity:1;transform:none}96.67%,100%{opacity:0}}.g2{animation:k2 15.0s ease-out infinite}@keyframes k3{0%,29.33%{opacity:0;transform:translateY(8px)}32.33%,93.33%{opacity:1;transform:none}96.67%,100%{opacity:0}}.g3{animation:k3 15.0s ease-out infinite}@keyframes k4{0%,48.00%{opacity:0;transform:translateY(8px)}51.00%,93.33%{opacity:1;transform:none}96.67%,100%{opacity:0}}.g4{animation:k4 15.0s ease-out infinite}@keyframes k5{0%,57.33%{opacity:0;transform:translateY(8px)}60.33%,93.33%{opacity:1;transform:none}96.67%,100%{opacity:0}}.g5{animation:k5 15.0s ease-out infinite}@keyframes k6{0%,65.33%{opacity:0;transform:translateY(8px)}68.33%,93.33%{opacity:1;transform:none}96.67%,100%{opacity:0}}.g6{animation:k6 15.0s ease-out infinite}
@media (prefers-reduced-motion:reduce){g[class^=g]{animation:none;opacity:1}.bar,.live{animation:none}}
</style>
<rect x="0.5" y="0.5" width="819" height="429" rx="16" fill="var(--bg)" stroke="var(--border)"/>
<rect x="0.5" y="0.5" width="819" height="62" rx="16" fill="var(--panel)"/>
<rect x="0.5" y="46" width="819" height="17" fill="var(--panel)"/>
<line x1="0" y1="63" x2="820" y2="63" stroke="var(--border)"/>
<circle cx="30" cy="32" r="5" fill="#e5484d" class="live"/>
<text x="44" y="29" class="title">Live call · Clínica Dental Los Tilos</text>
<text x="44" y="46" class="sub">ES / EN · real slots from the diary · every action checked in code</text>
