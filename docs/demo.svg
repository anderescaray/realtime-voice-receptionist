="animation-duration:0.91s;animation-delay:-0.52s"/><rect x="696" y="30.0" width="4" height="16" rx="2" class="bar" style="animation-duration:0.69s;animation-delay:-0.54s"/><rect x="704" y="34.0" width="4" height="8" rx="2" class="bar" style="animation-duration:0.85s;animation-delay:-0.16s"/><rect x="712" y="28.0" width="4" height="20" rx="2" class="bar" style="animation-duration:0.77s;animation-delay:-0.28s"/><rect x="720" y="30.0" width="4" height="16" rx="2" class="bar" style="animation-duration:0.98s;animation-delay:-0.16s"/><rect x="728" y="30.0" width="4" height="16" rx="2" class="bar" style="animation-duration:0.66s;animation-delay:-0.05s"/><rect x="736" y="31.5" width="4" height="13" rx="2" class="bar" style="animation-duration:0.77s;animation-delay:-0.47s"/><rect x="744" y="31.5" width="4" height="13" rx="2" class="bar" style="animation-duration:0.67s;animation-delay:-0.75s"/><rect x="752" y="30.5" width="4" height="15" rx="2" class="bar" style="animation-duration:0.88s;animation-delay:-0.03s"/><rect x="760" y="34.0" width="4" height="8" rx="2" class="bar" style="animation-duration:1.14s;animation-delay:-0.76s"/><rect x="768" y="30.0" width="4" height="16" rx="2" class="bar" style="animation-duration:0.61s;animation-delay:-0.23s"/><rect x="776" y="33.0" width="4" height="10" rx="2" class="bar" style="animation-duration:1.07s;animation-delay:-0.33s"/>
<g class="g0"><text x="44" y="84" class="lbl" text-anchor="start">Caller</text><rect x="40" y="92" width="351" height="34" rx="17" fill="var(--cb)"/><text x="56" y="114" class="msg" fill="var(--ct)">Hi! I'd like a cleaning next week, please.</text></g><g class="g1"><rect x="230.0" y="140" width="360" height="24" rx="6" class="tool"/><text x="242.0" y="156" class="code"><tspan class="fn">find_patient(name, dob)</tspan><tspan class="ok" dx="8">✓ patient identified</tspan></text></g><g class="g2"><rect x="230.0" y="170" width="360" height="24" rx="6" class="tool"/><text x="242.0" y="186" class="code"><tspan class="fn">search_availability(cleaning)</tspan><tspan class="ok" dx="8">✓ 5 free slots</tspan></text></g><g class="g3"><text x="776" y="214" class="lbl" text-anchor="end">Receptionist</text><rect x="414" y="222" width="366" height="34" rx="17" fill="var(--ab)"/><text x="430" y="244" class="msg" fill="#ffffff">Elena has Tuesday at 10:30. Shall I book it?</text></g><g class="g4"><text x="44" y="274" class="lbl" text-anchor="start">Caller</text><rect x="40" y="282" width="130" height="34" rx="17" fill="var(--cb)"/><text x="56" y="304" class="msg" fill="var(--ct)">Yes, perfect.</text></g><g class="g5"><rect x="230.0" y="324" width="360" height="24" rx="6" class="tool"/><text x="242.0" y="340" class="code"><tspan class="fn">book → confirm_pending</tspan><tspan class="ok" dx="8">✓ saved, no double booking</tspan></text></g><g class="g6"><rect x="220.0" y="362" width="380" height="48" rx="12" class="card"/><circle cx="246.0" cy="386" r="12" fill="var(--ok)"/><path d="M240.0 386 l4 4 l8 -8" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="268.0" y="382" class="cardt">Appointment booked</text><text x="268.0" y="399" class="cards">Cleaning · Tue 10:30 · Elena Torres</text></g>
</svg>
