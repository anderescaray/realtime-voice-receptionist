name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install dependencies
        run: uv sync --locked
      - name: make verify
        run: make verify

  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check for the frontend
        id: present
        run: |
          if [ -f frontend/package.json ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "No frontend/ yet: skipping."; fi
      - if: steps.present.outputs.yes == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - if: steps.present.outputs.yes == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - if: steps.present.outputs.yes == 'true'
        working-directory: frontend
        run: pnpm build
      - if: steps.present.outputs.yes == 'true'
        working-directory: frontend
        run: pnpm test
